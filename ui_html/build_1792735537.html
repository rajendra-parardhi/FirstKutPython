<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #e0e0e9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .auth-card {
      background-color: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background-color: #7064ea;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      margin-bottom: 24px;
    }

    .brand-logo svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #121212;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .input-field {
      width: 100%;
      height: 44px;
      background-color: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 14px;
      color: #121212;
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .input-field:focus {
      border-color: #7064ea;
      background-color: #ffffff;
    }

    .input-field::placeholder {
      color: #9ca3af;
    }

    .btn {
      width: 100%;
      height: 44px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background-color: #7064ea;
      color: #ffffff;
    }

    .btn-primary:hover {
      opacity: 0.92;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: #9ca3af;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: #e5e7eb;
    }

    .divider span {
      padding: 0 10px;
    }

    .btn-google {
      background-color: #f5f4f4;
      color: #121212;
      border: 1px solid #e5e7eb;
      margin-bottom: 12px;
    }

    .btn-google:hover {
      background-color: #ecebeb;
    }

    .btn-apple {
      background-color: #121212;
      color: #ffffff;
    }

    .btn-apple:hover {
      opacity: 0.88;
    }

    .signup-text {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }

    .signup-text a {
      color: #7064ea;
      text-decoration: none;
      font-weight: 600;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    .terms-text {
      margin-top: 18px;
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.4;
    }

    .terms-text a {
      color: #6b7280;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="auth-card">
    <div class="brand-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>

    <h1 class="title">Sign in with email</h1>
    <p class="subtitle">We'll send a secure login link to your email address.</p>

    <form onsubmit="event.preventDefault();">
      <div class="form-group">
        <input 
          type="email" 
          class="input-field" 
          placeholder="Enter your email address" 
          required 
          aria-label="Email address"
        />
      </div>

      <button type="submit" class="btn btn-primary">
        Send Magic Link
      </button>
    </form>

    <div class="divider">
      <span>OR</span>
    </div>

    <button class="btn btn-google" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>

    <button class="btn btn-apple" type="button">
      <svg width="16" height="18" viewBox="0 0 170 170" fill="currentColor">
        <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.71.13-9.56-1.92-14.56-6.13-3.26-2.72-7.13-7.39-11.6-14.02-6.2-9.25-11.09-19.82-14.67-31.71-3.58-11.89-5.37-23.01-5.37-33.36 0-14.13 3.51-25.75 10.53-34.86 7.02-9.11 15.82-13.78 26.4-14.01 4.58 0 9.8 1.16 15.66 3.48 5.86 2.32 9.7 3.5 11.53 3.5 1.52 0 5.51-1.22 11.96-3.66 6.45-2.45 11.83-3.56 16.15-3.35 11.96.65 21.36 4.92 28.2 12.82-10.66 6.42-15.86 15.34-15.6 26.76.26 8.81 3.53 16.27 9.8 22.38 6.27 6.11 13.9 9.87 22.89 11.28-2.29 6.86-5.29 13.79-9.01 20.81zM119.22 31.08c0-7.18 2.61-14.1 7.83-20.76 5.22-6.66 11.86-10.32 19.92-10.98.13.98.2 1.85.2 2.61 0 7.07-2.66 14.13-7.98 21.18-5.32 7.05-12 10.82-20.04 11.31-.13-.87-.2-1.99-.2-3.36z"/>
      </svg>
      Continue with Apple
    </button>

    <div class="signup-text">
      Don't have an account? <a href="#">Sign up</a>
    </div>

    <div class="terms-text">
      By continuing you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </div>
  </main>

</body>
</html>
