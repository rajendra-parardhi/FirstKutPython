<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #eff4fd;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      background-color: #fbfcfc;
      width: 100%;
      max-width: 440px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    .card-header {
      padding: 28px 28px 16px 28px;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .title {
      font-size: 25px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.2;
    }

    .subtitle-link {
      font-size: 11px;
      color: #1068ff;
      text-decoration: none;
      font-weight: 500;
    }

    .subtitle-link:hover {
      text-decoration: underline;
    }

    .accent-bars {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }

    .bar-1 {
      width: 27px;
      height: 4px;
      background-color: #c5d2fe;
      border-radius: 2px;
    }

    .bar-2 {
      width: 34px;
      height: 4px;
      background-color: #d0d9fe;
      border-radius: 2px;
    }

    .divider {
      height: 1px;
      background-color: #e2e8f0;
      width: 100%;
    }

    .card-body {
      padding: 24px 28px 28px 28px;
    }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }

    .form-label {
      font-size: 14px;
      font-weight: 500;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-label.password-label {
      font-size: 13px;
    }

    .form-input {
      width: 100%;
      height: 38px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-email {
      background-color: #fafbfb;
    }

    .input-password {
      background-color: #f9fafa;
    }

    .form-input:focus {
      border-color: #1068ff;
      box-shadow: 0 0 0 3px rgba(16, 104, 255, 0.15);
    }

    .remember-me-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      margin-bottom: 20px;
    }

    .remember-me-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #1068ff;
      cursor: pointer;
    }

    .remember-me-label {
      font-size: 13px;
      color: #475569;
      cursor: pointer;
      user-select: none;
    }

    .btn {
      width: 100%;
      height: 40px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background-color: #1068ff;
      color: #ffffff;
      font-size: 17px;
      margin-bottom: 12px;
    }

    .btn-primary:hover {
      background-color: #0056e0;
    }

    .btn-secondary {
      background-color: #f4f4f4;
      color: #334155;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }

    .btn-secondary:hover {
      background-color: #e9e9e9;
    }

    .google-icon {
      width: 18px;
      height: 18px;
    }

    .forgot-link-wrap {
      text-align: center;
    }

    .forgot-link {
      font-size: 13px;
      color: #1068ff;
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .card-footer {
      background-color: #fefefe;
      padding: 16px 28px;
      text-align: center;
      border-top: 1px solid #f1f5f9;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <main class="auth-card">
    <header class="card-header">
      <div class="title-row">
        <h1 class="title">Sign in</h1>
        <a href="#" class="subtitle-link">or create an account</a>
      </div>
      <div class="accent-bars">
        <div class="bar-1"></div>
        <div class="bar-2"></div>
      </div>
    </header>

    <div class="divider"></div>

    <section class="card-body">
      <form onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-input input-email" placeholder="Email" required />
        </div>

        <div class="form-group">
          <label for="password" class="form-label password-label">Password</label>
          <input type="password" id="password" class="form-input input-password" placeholder="Password" required />
        </div>

        <div class="remember-me-group">
          <input type="checkbox" id="remember" />
          <label for="remember" class="remember-me-label">Remember me</label>
        </div>

        <button type="submit" class="btn btn-primary">Sign in</button>

        <button type="button" class="btn btn-secondary">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Sign in with Google
        </button>

        <div class="forgot-link-wrap">
          <a href="#" class="forgot-link">Forgotten your password?</a>
        </div>
      </form>
    </section>

    <footer class="card-footer">
      Protected by reCAPTCHA and Privacy Policy
    </footer>
  </main>

</body>
</html>
