<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspirational Quote Poster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #9d8076;
      font-family: 'Cormorant Garamond', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow-x: hidden;
    }

    /* Top Accent Bar (id: 1) */
    .top-bar {
      width: 100%;
      height: 60px;
      background-color: #987568;
    }

    /* Main Poster Canvas */
    .canvas {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Decorative Shapes (ids: 6, 2, 4, 0, 5) */
    .shape {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .shape-1 {
      width: 200px;
      height: 200px;
      background-color: rgba(136, 132, 144, 0.35);
      top: 15%;
      left: 15%;
    }

    .shape-2 {
      width: 80px;
      height: 80px;
      background-color: #6d778f;
      top: 25%;
      right: 20%;
    }

    .shape-3 {
      width: 70px;
      height: 70px;
      background-color: #9695a5;
      bottom: 25%;
      left: 20%;
      border-radius: 12px;
    }

    .shape-4 {
      width: 90px;
      height: 55px;
      background-color: #737d96;
      bottom: 20%;
      right: 15%;
      border-radius: 30px;
    }

    .shape-5 {
      width: 60px;
      height: 60px;
      background-color: #927a73;
      top: 18%;
      right: 35%;
    }

    /* Central Quote Card Container (id: 3 root text) */
    .quote-card {
      position: relative;
      z-index: 2;
      background: rgba(157, 128, 118, 0.85);
      backdrop-filter: blur(8px);
      padding: 48px 36px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      max-width: 480px;
    }

    .quote-mark {
      font-size: 4rem;
      line-height: 1;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: -10px;
      display: block;
    }

    .quote-text {
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: 300;
      line-height: 1.5;
      letter-spacing: 0.5px;
    }

    /* Small Accent Line Divider (id: 9) */
    .divider {
      width: 45px;
      height: 3px;
      background-color: #98786b;
      margin: 24px auto 0 auto;
      border-radius: 2px;
    }

    /* Bottom Accent Bar (id: 7 & 8) */
    .bottom-bar {
      width: 100%;
      height: 60px;
      background-color: #917b75;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bottom-accent {
      width: 42px;
      height: 4px;
      background-color: #9a807a;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <!-- Top Accent Bar (id: 1) -->
  <header class="top-bar"></header>

  <!-- Main Canvas -->
  <main class="canvas">
    <!-- Visual Feature Elements -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
    <div class="shape shape-5"></div>

    <!-- Quote Card Container -->
    <div class="quote-card">
      <span class="quote-mark">“</span>
      <p class="quote-text">
        Let go of what weighs you down.<br>
        Focus on what feeds your soul.
      </p>
      <div class="divider"></div>
    </div>
  </main>

  <!-- Bottom Accent Bar (id: 7) -->
  <footer class="bottom-bar">
    <div class="bottom-accent"></div>
  </footer>

</body>
</html>
