<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <style>
    :root {
      --bg-color: #e0e0e9;
      --card-bg: #ffffff;
      --primary-color: #7064ea;
      --primary-hover: #5d51d6;
      --input-bg: #f3f4f6;
      --google-bg: #f5f4f4;
      --google-hover: #eaeaea;
      --apple-bg: #121212;
      --apple-hover: #2a2a2a;
      --text-main: #121212;
      --text-muted: #6b7280;
      --text-light: #9ca3af;
      --border-color: #e5e7eb;
      --icon-bg: #eeeff0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .auth-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      padding: 2.25rem 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }

    .logo-badge {
      width: 32px;
      height: 32px;
      background-color: var(--icon-bg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .logo-badge svg {
      width: 18px;
      height: 18px;
      fill: var(--text-main);
    }

    .title {
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      height: 46px;
      padding: 0 1rem;
      font-size: 0.875rem;
      background-color: var(--input-bg);
      border: 1.5px solid transparent;
      border-radius: 10px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input::placeholder {
      color: var(--text-light);
    }

    .form-input:focus {
      border-color: var(--primary-color);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(112, 100, 234, 0.15);
    }

    .btn {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 10px;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background-color: var(--border-color);
    }

    .divider-text {
      padding: 0 0.75rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-light);
      text-transform: uppercase;
    }

    .social-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .btn-google {
      background-color: var(--google-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-google:hover {
      background-color: var(--google-hover);
    }

    .btn-apple {
      background-color: var(--apple-bg);
      color: #ffffff;
    }

    .btn-apple:hover {
      background-color: var(--apple-hover);
    }

    .signup-prompt {
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .signup-link {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 700;
    }

    .signup-link:hover {
      text-decoration: underline;
    }

    .terms-text {
      text-align: center;
      font-size: 0.6875rem;
      color: var(--text-light);
      line-height: 1.4;
    }

    .terms-text a {
      color: var(--text-light);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="auth-card">
    <!-- Icon / Logo Container -->
    <div class="logo-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
      </svg>
    </div>

    <!-- Title & Subtitle -->
    <h1 class="title">Sign in with email</h1>
    <p class="subtitle">We'll send a secure login link to your email address.</p>

    <!-- Email Form -->
    <form onsubmit="event.preventDefault();">
      <div class="form-group">
        <label for="email" class="form-label">Email address</label>
        <input 
          type="email" 
          id="email" 
          class="form-input" 
          placeholder="Enter your email address" 
          required 
          autocomplete="email"
        />
      </div>

      <button type="submit" class="btn btn-primary">
        Send Magic Link
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or</span>
      <div class="divider-line"></div>
    </div>

    <!-- Social Sign In Options -->
    <div class="social-buttons">
      <button type="button" class="btn btn-google">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continue with Google
      </button>

      <button type="button" class="btn btn-apple">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.62-.76 1.04-1.81.93-2.87-.9.04-2 .6-2.65 1.36-.58.68-.99 1.76-.85 2.81 1.01.08 2.05-.53 2.57-1.3"/>
        </svg>
        Continue with Apple
      </button>
    </div>

    <!-- Sign Up Redirect -->
    <p class="signup-prompt">
      Don't have an account? <a href="#" class="signup-link">Sign up</a>
    </p>

    <!-- Terms & Policy -->
    <p class="terms-text">
      By continuing you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
    </p>
  </main>

</body>
</html>
