<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parser Hierarchy Diagram</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .tree-card {
      background-color: #ad8d8c;
      width: 100%;
      max-width: 640px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .node {
      color: #ffffff;
      border-radius: 8px;
      padding: 10px 16px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      user-select: none;
    }

    .node:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .root-node {
      background-color: #ec514a;
      font-size: 16px;
      font-weight: 700;
      padding: 10px 32px;
    }

    .connector-v {
      width: 2px;
      height: 20px;
      background-color: rgba(255, 255, 255, 0.6);
    }

    .connector-h-wrap {
      width: 70%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .connector-h {
      width: 100%;
      height: 2px;
      background-color: rgba(255, 255, 255, 0.6);
    }

    .branches-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      margin-top: 16px;
    }

    .branch {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .category-node {
      font-weight: 600;
      font-size: 14px;
      width: 100%;
    }

    .topdown-title {
      background-color: #a98f8e;
    }

    .bottomup-title {
      background-color: #ef534c;
    }

    .sub-branches {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-top: 16px;
    }

    .node-rd {
      background-color: #ed5952;
      font-size: 11px;
    }

    .node-ll1 {
      background-color: #ef514b;
    }

    .node-lr {
      background-color: #ed534d;
    }

    .node-op {
      background-color: #eb5a52;
      font-size: 11px;
    }

    .lr-variants-box {
      background-color: #ffffff;
      border: 2px solid #d6b6a6;
      border-radius: 8px;
      padding: 10px 6px;
      margin-top: 12px;
      width: 100%;
      text-align: center;
      color: #ad8d8c;
      font-weight: 700;
      font-size: 11px;
      line-height: 1.5;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
    }

    .lr-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .footer-bars {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 24px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .bar-1 {
      width: 45px;
      height: 12px;
      background-color: #abaca3;
      border-radius: 4px;
    }

    .bar-2 {
      width: 63px;
      height: 14px;
      background-color: #bdb6bc;
      border-radius: 4px;
    }

    .bar-3 {
      width: 23px;
      height: 14px;
      background-color: #d6b6a6;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <main class="tree-card">
    <!-- Root Level -->
    <div class="node root-node">Parser</div>
    <div class="connector-v"></div>
    
    <!-- Splitter -->
    <div class="connector-h-wrap">
      <div class="connector-h"></div>
    </div>

    <!-- Main Categories -->
    <section class="branches-grid">
      
      <!-- Topdown Parser Branch -->
      <article class="branch">
        <div class="node category-node topdown-title">Topdown Parser</div>
        <div class="connector-v"></div>
        
        <div class="sub-branches">
          <div class="node node-rd">Recursive descent parser</div>
          <div class="node node-ll1">LL(1)</div>
        </div>
      </article>

      <!-- Bottomup Parser Branch -->
      <article class="branch">
        <div class="node category-node bottomup-title">Bottomup Parser</div>
        <div class="connector-v"></div>
        
        <div class="sub-branches">
          <div class="lr-column">
            <div class="node node-lr">LR parser</div>
            <div class="connector-v" style="height: 12px;"></div>
            <div class="lr-variants-box">
              LR(0)&nbsp;&nbsp;SLR(1)<br>
              LALR(1)&nbsp;&nbsp;CLR(1)
            </div>
          </div>
          <div class="node node-op">Operator precedence parser</div>
        </div>
      </article>

    </section>

    <!-- Decorative status badges -->
    <footer class="footer-bars">
      <div class="bar-1"></div>
      <div class="bar-2"></div>
      <div class="bar-3"></div>
    </footer>
  </main>

</body>
</html>
