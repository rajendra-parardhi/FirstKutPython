<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #59636e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .login-card {
      background-color: #899198;
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      letter-spacing: 1.2px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .input-field {
      width: 100%;
      border: none;
      outline: none;
      border-radius: 6px;
      padding: 12px 14px;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-email {
      height: 44px;
      background-color: #e4e5e9;
      font-size: 16px;
      color: #2d3748;
    }

    .input-password {
      height: 44px;
      background-color: #dcdee2;
      font-size: 14px;
      color: #2d3748;
    }

    .input-field::placeholder {
      color: #718096;
    }

    .input-field:focus {
      box-shadow: 0 0 0 2px #485661;
    }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
    }

    .btn-login {
      background-color: #485661;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-login:hover {
      background-color: #38434c;
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .reset-link {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .reset-link:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <main class="login-card">
    <h1 class="title">USER LOGIN</h1>
    <form onsubmit="event.preventDefault();">
      <div class="form-group">
        <input 
          type="email" 
          class="input-field input-email" 
          placeholder="Email ID" 
          required 
          aria-label="Email ID"
        />
      </div>
      <div class="form-group">
        <input 
          type="password" 
          class="input-field input-password" 
          placeholder="Password" 
          required 
          aria-label="Password"
        />
      </div>
      <div class="action-row">
        <button type="submit" class="btn-login">LOGIN</button>
        <a href="#reset" class="reset-link">Reset Password</a>
      </div>
    </form>
  </main>

</body>
</html>
