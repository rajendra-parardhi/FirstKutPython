<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StoryForge — UI Prototype (mocked, no APIs)</title>
<!--
  ============================================================================
  StoryForge PROTOTYPE — reference build for the implementation team.
  Open this file in any browser (double-click). No server, no APIs, no internet.

  Comment markers in the script map 1:1 to STORYFORGE-IMPLEMENTATION-PLAN.md:
    [FEATURE 1] Foundation & Jira Connection  -> shell, Connections, Finder, Query Builder
    [FEATURE 2] Backlog Health Score          -> scorecard modal + rubric popover
    [FEATURE 3] Polish                        -> 4-step wizard + Diff View + Approve & Sync
    [FEATURE 4] Create & Decompose            -> Create Epic / Split / Break down wizards
    [FEATURE 5] Batch Polish                  -> multi-select batch run with partial failure
    [FEATURE 6] Design Import (Figma)         -> 5-step in-page flow
  Everything labelled MOCK_* stands in for a real API / LLM call.
  ============================================================================
-->
<style>
  :root{
    --rail:#141833; --rail-ink:#9AA1C9; --ink:#1B1F3B; --muted:#6B7194;
    --bg:#F4F5FB; --card:#FFFFFF; --line:#E5E7F2;
    --accent:#6459E8; --accent-soft:#EEEDFD;
    --good:#12A150; --good-soft:#E9F8EF;
    --warn:#DE8A00; --warn-soft:#FFF4E2;
    --bad:#E5484D;  --bad-soft:#FDEEED;
    --info:#2E7BE4; --info-soft:#E9F2FE;
    --shadow:0 10px 30px rgba(20,24,51,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.5 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}
  a{color:var(--accent)}
  .muted{color:var(--muted)}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}

  /* ---------- prototype banner ---------- */
  #banner{background:#2A1E05;color:#FFD98A;font-size:12px;padding:5px 16px;display:flex;gap:14px;align-items:center;border-bottom:1px solid #4A370B}
  #banner b{color:#FFE9BD}
  #banner .dot{width:7px;height:7px;border-radius:50%;background:#FFB020;display:inline-block;margin-right:6px}

  /* ---------- top bar ---------- */
  #topbar{height:52px;background:var(--rail);color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px;position:sticky;top:0;z-index:40}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.2px}
  .logo .mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#7B6CFF,#4ED7C8);transform:rotate(45deg);border-radius:6px}
  .logo small{font-weight:400;color:#8E96C9;font-size:11px;border:1px solid #343A66;border-radius:20px;padding:1px 8px;margin-left:4px}
  #topbar .spacer{flex:1}
  .chip{display:inline-flex;align-items:center;gap:7px;border-radius:20px;padding:4px 11px;font-size:12.5px;line-height:1.4}
  .chip.dark{background:#232851;color:#CDD3F5;border:1px solid #343A66}
  .chip.dark .ok{color:#3ED598}
  .avatar{width:28px;height:28px;border-radius:50%;background:#7B6CFF;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

  /* ---------- shell / rail ---------- */
  .shell{display:flex;min-height:calc(100vh - 84px)}
  #rail{width:216px;background:var(--rail);padding:14px 10px;flex:0 0 216px}
  #rail .grp{font-size:10.5px;letter-spacing:1.2px;color:#5D648F;text-transform:uppercase;margin:14px 10px 6px}
  .rail-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--rail-ink);cursor:pointer;user-select:none;margin-bottom:2px}
  .rail-item:hover{background:#1C2145;color:#DFE3FF}
  .rail-item.on{background:var(--accent);color:#fff}
  .rail-item .ico{width:17px;text-align:center;opacity:.9}
  .rail-item .badge{margin-left:auto;background:#2A2F5C;color:#AEB6E6;font-size:11px;border-radius:10px;padding:0 7px}
  .rail-item.on .badge{background:rgba(255,255,255,.25);color:#fff}
  #main{flex:1;padding:18px 22px 40px;min-width:0}

  /* ---------- page head ---------- */
  .page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
  .page-head h1{font-size:19px;margin:0 0 3px}
  .page-head p{margin:0;color:var(--muted);font-size:13px}
  .page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

  /* ---------- buttons ---------- */
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 14px;font-weight:600;font-size:13px;display:inline-flex;gap:7px;align-items:center}
  .btn:hover{border-color:#C9CDE2;background:#FAFAFF}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#5549E0}
  .btn.primary:disabled,.btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--bad);border-color:#F3C9C9}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .btn.wide{width:100%;justify-content:center}
  .icon-btn{border:1px solid transparent;background:transparent;border-radius:7px;width:28px;height:28px;line-height:1;color:var(--muted)}
  .icon-btn:hover{background:#EEF0F9;color:var(--ink)}

  /* ---------- cards / table ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(20,24,51,.04)}
  .card .pad{padding:14px 16px}
  .toolbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .toolbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  table.grid{width:100%;border-collapse:collapse}
  table.grid th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:#FBFBFE;white-space:nowrap}
  table.grid td{padding:10px 12px;border-bottom:1px solid #EFEFF7;vertical-align:middle}
  table.grid tr:hover td{background:#FAFAFF}
  table.grid tr.sel td{background:var(--accent-soft)}
  .sum{max-width:430px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .key{font-weight:600;text-decoration:none}
  .key:hover{text-decoration:underline}
  .row-act{position:relative;text-align:right}

  /* ---------- chips ---------- */
  .st{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
  .st-Backlog{background:#ECEEF5;color:#5B6180}
  .st-Discovery{background:#F1EDFD;color:#6C4FD6}
  .st-"In Progress"{background:var(--info-soft);color:var(--info)}
  .st-InProgress{background:var(--info-soft);color:var(--info)}
  .st-Ready{background:#E4F7F4;color:#0F8F7E}
  .st-Accepted{background:var(--good-soft);color:var(--good)}
  .score{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:2px 10px 2px 4px;font-weight:700;font-size:12.5px;cursor:pointer}
  .score .ring{width:20px;height:20px}
  .score.lo{border-color:#F3C9C9;background:var(--bad-soft);color:#B3373B}
  .score.md{border-color:#F5DFB4;background:var(--warn-soft);color:#9A6200}
  .score.hi{border-color:#BFE8D0;background:var(--good-soft);color:#0C7A3E}
  .score small{font-weight:600;opacity:.7}
  .mk{display:inline-block;font-size:11.5px;border-radius:5px;padding:1px 7px;background:var(--accent-soft);color:#5145C7;border:1px solid #DAD6FB;font-family:ui-monospace,Consolas,monospace}
  .delta{font-size:11.5px;color:var(--muted);margin-left:6px}

  /* ---------- dropdown menu ---------- */
  .menu{position:absolute;right:6px;top:30px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:190px;padding:5px;display:none;z-index:30;text-align:left}
  .menu.show{display:block}
  .menu button{display:flex;gap:9px;width:100%;border:0;background:none;padding:8px 10px;border-radius:7px;font-size:13px;text-align:left;color:var(--ink)}
  .menu button:hover{background:#F3F2FD}
  .menu .sep{height:1px;background:var(--line);margin:4px 2px}
  .menu .head{font-size:11px;color:var(--muted);padding:5px 10px 2px;letter-spacing:.5px;text-transform:uppercase}

  /* ---------- applied JQL chip ---------- */
  .jql{display:flex;gap:8px;align-items:center;margin:0 0 12px}
  .jql .q{background:#221F3D;color:#C9C4FF;border-radius:7px;padding:5px 10px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .jql .x{border:0;background:none;color:#8E86FF;cursor:pointer;font-weight:700}

  /* ---------- modal / wizard ---------- */
  #modal-root{position:fixed;inset:0;background:rgba(16,18,40,.55);display:none;z-index:60;padding:34px 16px;overflow:auto}
  #modal-root.show{display:block}
  .sheet{background:#fff;border-radius:14px;box-shadow:var(--shadow);max-width:1060px;margin:0 auto;overflow:hidden}
  .sheet.narrow{max-width:640px}
  .sheet-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .sheet-head h2{font-size:16px;margin:0}
  .sheet-head .k{color:var(--muted);font-weight:600}
  .sheet-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .wiz{display:flex;min-height:430px}
  .stepper{width:222px;border-right:1px solid var(--line);background:#FBFBFE;padding:18px 14px;flex:0 0 222px}
  .stepper li{list-style:none;display:flex;gap:11px;align-items:flex-start;padding:9px 6px;color:var(--muted);font-weight:600;font-size:13px;border-radius:8px}
  .stepper li .dot{width:22px;height:22px;border-radius:50%;background:#E9EBF6;color:#7A80A6;display:grid;place-items:center;font-size:11.5px;flex:0 0 22px}
  .stepper li.on{color:var(--ink);background:var(--accent-soft)}
  .stepper li.on .dot{background:var(--accent);color:#fff}
  .stepper li.done{color:var(--good)}
  .stepper li.done .dot{background:var(--good-soft);color:var(--good)}
  .wiz-body{flex:1;padding:20px 22px;min-width:0;max-height:66vh;overflow:auto}
  .wiz-foot{display:flex;gap:9px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--line);background:#FBFBFE}
  .wiz h3{margin:0 0 4px;font-size:15px}
  .wiz .hint{color:var(--muted);font-size:12.5px;margin:0 0 14px}

  /* ---------- forms ---------- */
  label.f{display:block;font-size:12.5px;font-weight:700;color:#4A4F73;margin:14px 0 5px}
  input[type=text],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  textarea{min-height:96px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .checks{display:flex;flex-wrap:wrap;gap:9px}
  .checks label{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:#fff;cursor:pointer;font-weight:600;font-size:13px}
  .checks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:#4A40C7}
  .radio-line{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13.5px}
  .drop{border:1.5px dashed #CFD3EA;border-radius:10px;padding:16px;text-align:center;color:var(--muted);background:#FBFBFF;font-size:13px}
  .drop b{color:var(--accent)}
  .filepill{display:inline-flex;gap:7px;align-items:center;background:var(--accent-soft);border:1px solid #DDD9FC;border-radius:7px;padding:3px 9px;font-size:12.5px;margin:6px 6px 0 0}
  .counter{font-size:11.5px;color:var(--muted);text-align:right;margin-top:3px}
  .err{color:var(--bad);font-size:12.5px;margin-top:6px}

  /* ---------- spinner / states ---------- */
  .spin{width:34px;height:34px;border:3px solid #E6E4FB;border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
  .spin.sm{width:16px;height:16px;border-width:2px;margin:0}
  @keyframes sp{to{transform:rotate(360deg)}}
  .center-state{text-align:center;padding:44px 10px;color:var(--muted)}
  .center-state b{display:block;color:var(--ink);font-size:15px;margin-bottom:3px}
  .toast-err{background:var(--bad-soft);border:1px solid #F3C9C9;color:#9E2F33;border-radius:9px;padding:10px 13px;font-size:13px;display:flex;gap:9px;align-items:center}

  /* ---------- scorecard ---------- */
  .score-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .gauge{position:relative;width:96px;height:96px;flex:0 0 96px}
  .gauge svg{transform:rotate(-90deg)}
  .gauge .val{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800}
  .metric{text-align:center;padding:4px 14px;border-left:1px solid var(--line)}
  .metric b{display:block;font-size:21px}
  .metric span{font-size:12px;color:var(--muted)}
  .pill{border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700;border:1px solid}
  .pill.bad{color:#B3373B;background:var(--bad-soft);border-color:#F3C9C9}
  .pill.warn{color:#9A6200;background:var(--warn-soft);border-color:#F5DFB4}
  .pill.good{color:#0C7A3E;background:var(--good-soft);border-color:#BFE8D0}
  .fb{border-left:3px solid var(--line);background:#FBFBFE;border-radius:0 8px 8px 0;padding:10px 13px;margin-top:10px}
  .fb b{font-size:13px}
  .fb .pt{float:right;font-weight:800;font-size:13px}
  .fb p{margin:5px 0 0;font-size:13px;color:#4A4F73}
  .fb.ok{border-color:var(--good)} .fb.mid{border-color:var(--warn)} .fb.no{border-color:var(--bad)}
  .rubric{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px;background:#fff;font-size:13px}
  .rubric table{width:100%;border-collapse:collapse;margin-top:8px}
  .rubric td,.rubric th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:12.5px}
  .formula{font-family:ui-monospace,Consolas,monospace;background:#221F3D;color:#B9B3FF;border-radius:7px;padding:8px 11px;font-size:12.5px;margin-top:9px}

  /* ---------- diff view ---------- */
  .diff-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--accent);color:#fff}
  .diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .diff-col h4{margin:0 0 7px;font-size:13px;display:flex;gap:8px;align-items:center}
  .diff-col .body{border-radius:10px;padding:12px 14px;font-size:13px;white-space:pre-wrap;border:1px solid}
  .diff-col.cur .body{background:#FFF3F3;border-color:#F5D4D4;color:#7A3134}
  .diff-col.inc .body{background:#F0FBF4;border-color:#CDEBDA;color:#1C5E39}
  .diff-col h4 .tag{font-size:11px;border-radius:5px;padding:1px 7px;font-weight:700}
  .diff-col.cur .tag{background:#FBE3E3;color:#A63A3D}
  .diff-col.inc .tag{background:#DCF3E6;color:#137A47}
  .diff-sec{margin-bottom:16px}
  .chip-delta{font-size:11.5px;font-weight:800;border-radius:6px;padding:1px 7px;background:#DCF3E6;color:#137A47;margin-left:auto}

  /* ---------- generated item list ---------- */
  .gen{border:1px solid #CFE9DB;background:#F6FCF8;border-radius:10px;padding:11px 13px;margin-bottom:9px;display:flex;gap:11px;align-items:flex-start}
  .gen .tg{border:1px solid #BFE8D0;background:#fff;color:#0C7A3E;border-radius:20px;font-size:11.5px;font-weight:700;padding:1px 9px;flex:0 0 auto;margin-top:1px}
  .gen .ttl{font-weight:650;font-size:13.5px;flex:1;min-width:0}
  .gen .ttl .sub{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:4px;white-space:pre-wrap}
  .gen .tools{display:flex;gap:4px}
  .gen.collapsed{cursor:pointer}
  .gen input[type=checkbox]{margin-top:3px}

  /* ---------- batch ---------- */
  .batch-row{display:flex;gap:11px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:8px}
  .batch-row .stt{margin-left:auto;font-size:12.5px;font-weight:700}
  .batch-row .stt.q{color:var(--muted)} .batch-row .stt.r{color:var(--info)} .batch-row .stt.d{color:var(--good)} .batch-row .stt.f{color:var(--bad)}
  .bar{height:8px;border-radius:6px;background:#ECEEF8;overflow:hidden;margin:12px 0 4px}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .35s}

  /* ---------- design import ---------- */
  .fstep{display:flex;gap:0;margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 8px}
  .fstep .s{flex:1;text-align:center;position:relative;font-size:12.5px;font-weight:700;color:var(--muted)}
  .fstep .s .n{width:26px;height:26px;border-radius:50%;background:#ECEEF8;color:#7A80A6;display:grid;place-items:center;margin:0 auto 5px;font-size:12px}
  .fstep .s.on{color:var(--ink)} .fstep .s.on .n{background:var(--accent);color:#fff}
  .fstep .s.done{color:var(--good)} .fstep .s.done .n{background:var(--good-soft);color:var(--good)}
  .fstep .s:not(:last-child):after{content:"";position:absolute;top:13px;right:-6px;width:12px;height:2px;background:#E4E6F2}
  .screens{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .screen{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;position:relative}
  .screen.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .screen .thumb{background:#EDEFF8;display:block;width:100%;height:132px}
  .screen .cap{padding:8px 11px;font-size:12.5px;font-weight:650;display:flex;align-items:center;gap:7px}
  .screen .tick{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent}
  .screen.on .tick{background:var(--accent);border-color:var(--accent);color:#fff}
  .spec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .spec h4{margin:0 0 4px;font-size:13.5px}
  .spec .kv{font-size:12.8px;color:#4A4F73;margin-top:7px}
  .spec .kv b{color:var(--ink)}
  .story-card{border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:11px;overflow:hidden}
  .story-card .sh{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);background:#FBFBFE}
  .story-card .sb{padding:12px 14px;font-size:13px}
  .story-card pre{background:#221F3D;color:#C7F2DD;border-radius:8px;padding:11px 13px;font-size:12.3px;line-height:1.55;overflow:auto;margin:8px 0 0;font-family:ui-monospace,Consolas,monospace}
  .thumbsm{width:74px;height:46px;border-radius:6px;background:#EDEFF8;flex:0 0 74px;overflow:hidden}
  .thumbsm svg{display:block}

  /* ---------- toasts ---------- */
  #toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:9px;max-width:400px}
  .toast{background:#1C2145;color:#EAEbff;border-radius:10px;padding:11px 15px;font-size:13px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;animation:tin .25s ease}
  .toast.ok{background:#0E3B25;color:#C9F5DF;border:1px solid #1C6B45}
  .toast.err{background:#4A1B1D;color:#FFD9DA;border:1px solid #7A3134}
  .toast b{display:block}
  @keyframes tin{from{transform:translateY(8px);opacity:0}}
  .link-btn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;cursor:pointer;font-size:inherit}
  .inline-note{font-size:12.5px;color:var(--muted);margin-top:9px}
  .kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11.5px;background:#FAFAFF}
  @media (max-width:900px){.wiz{flex-direction:column}.stepper{width:auto;flex:none;display:flex;gap:6px;overflow:auto}.diff-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header id="topbar">
  <div class="logo"><span class="mark"></span>StoryForge <small>AI Backlog Studio</small></div>
  <span class="chip dark">Project: <b>PAYOPS</b> · Payments Operations</span>

function qbJql(){
  const tName = state.module === "epics" ? "Epic" : state.module === "features" ? "Feature" : "Story";
  let q = 'project = PAYOPS AND issuetype = "' + tName + '"';
  const st = ($("#qb-status") || {}).value, as = ($("#qb-assignee") || {}).value,
        lb = (($("#qb-labels") || {}).value || "").trim(), ud = ($("#qb-updated") || {}).value;

   [FEATURE 2] SCORECARD — Health Score + rubric popover
   ========================================================================== */
const FEEDBACK = {
  bad:  { Summary:"The summary lists multiple distinct initiatives rather than a single, concise action.",
          Description:"Details multiple initiatives with their own scope but no cohesive business value statement or constraints.",
          "Success Criteria":"Acceptance criteria are vague and too broad to be testable — they do not define what 'done' means.",
          "Value Statement":"Value statement is missing or does not articulate a measurable benefit." },
  good: { Summary:"Concise and clearly expresses the purpose of the item.",
          Description:"Outlines business value, scope, constraints and background; details what will be delivered.",
          "Success Criteria":"Clear, testable criteria that cover the key scenarios and edge cases.",
          "Value Statement":"Articulates the key benefit and value proposition clearly." }
};
const RUBRIC = [
  ["Summary", "1: concise, clear action/purpose · 0: missing/vague", "1"],
  ["Description", "3: value, scope, constraints, background · 2: lacks detail · 1: vague · 0: missing", "3"],
  ["Acceptance Criteria / Success Criteria", "3: clear, testable, covers scenarios · 2: partial · 1: imprecise · 0: missing", "3"],
  ["Value Statement (Features only)", "1: clear articulation of value · 0: missing/vague", "1"]
];
function findIssue(key){ return DB.epics.concat(DB.features, DB.stories).find(i => i.key === key); }
function openScorecard(key){
  const i = findIssue(key);
  const parts = i.type === "Feature"
    ? [["Summary",0,1],["Description",2,3],["Success Criteria",1,3],["Value Statement",1,1]]
    : [["Summary", i.score >= 4 ? 1 : 0, 1],["Description", i.score >= 4 ? 3 : i.score >= 2 ? 2 : 1, 3],
       [i.type === "Epic" ? "Success Criteria" : "Acceptance Criteria", i.score >= 4 ? 3 : i.score >= 2 ? 1 : 1, 3]];
  const status = i.score <= 2 ? ["Needs Attention","bad"] : i.score === 3 ? ["Average","warn"] : ["Healthy","good"];
  const issues = parts.reduce((a,p) => a + (p[1] < p[2] ? 1 : 0), 0);
  const circ = 2 * Math.PI * 42;
  openSheet({
    narrow:false,
    title:i.key, sub:"Backlog Health Score",
    body:
      '<div class="score-top">' +
        '<div class="gauge"><svg width="96" height="96"><circle cx="48" cy="48" r="42" fill="none" stroke="#ECEEF8" stroke-width="10"/>' +
          '<circle cx="48" cy="48" r="42" fill="none" stroke="' + (i.score <= 2 ? "#E5484D" : i.score === 3 ? "#DE8A00" : "#12A150") +
          '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (circ * i.score / 5) + ' ' + circ + '"/></svg>' +
          '<span class="val">' + i.score + '</span></div>' +
        '<div class="metric"><b>' + i.score + '/5</b><span>Health Score</span></div>' +
        '<div class="metric"><b>' + (issues ? "⚠ " + issues : "✔ 0") + '</b><span>Issues found</span></div>' +
        '<div class="metric"><span class="pill ' + status[1] + '">' + status[0] + '</span><span>Status</span></div>' +
        '<div style="margin-left:auto;text-align:right">' +
          (i.before ? '<span class="mk">' + i.before + ' → ' + i.score + ' after polish</span><br>' : '') +
          (i.marker ? '<span class="mk" style="margin-top:6px">' + i.marker + '</span>' : '') + '</div>' +
      '</div>' +
      '<div class="muted" style="font-size:12.5px;margin-top:10px">' + i.type + ' · ' + i.status + ' · ' + i.assignee + '</div>' +
      parts.map(p => {
        const cls = p[1] === 0 ? "no" : p[1] < p[2] ? "mid" : "ok";
        const key = p[0].replace("Acceptance Criteria","Success Criteria");
        const txt = (i.score >= 4 ? FEEDBACK.good : FEEDBACK.bad)[key] || FEEDBACK.good.Description;
        return '<div class="fb ' + cls + '"><span class="pt" style="float:right;font-weight:800">' + p[1] + ' / ' + p[2] + '</span>' +
               '<b>' + p[0] + ' feedback</b><p>' + txt + '</p></div>';
      }).join("") +
      '<button class="link-btn" style="margin-top:12px" onclick="toggleRubric()">ⓘ How scoring works</button>' +
      '<div class="rubric" id="rubric" style="display:none">' +
        '<b>' + i.type + ' Scorecard</b>' +
        '<table><tr><th>Criterion</th><th>Scoring guidelines</th><th>Max</th></tr>' +
        RUBRIC.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>').join("") + '</table>' +
        '<div class="formula">score = floor( (sum of criterion points / max points) × 5 )</div>' +
        '<div class="inline-note">Evaluated by the LLM on every fetch and re-evaluated after each polish so the ' +
        'table can show <b>before → after</b>.</div>' +
      '</div>',
    foot:'<button class="btn" onclick="closeModal()">Close</button>' +
         '<button class="btn primary" onclick="closeModal();openWizard(\'polish\',\'' + i.key + '\')">✨ Polish this ' + i.type + '</button>'
  });
}

let W = null;
const STEPS = ["Details","Instructions","Draft","Assign & Publish"];
function openWizard(kind, key){
  const issue = key ? findIssue(key) : null;
  W = {
    kind, key, step:0, issue,
    data:{
      fields:{ summary:true, description:true, successCriteria:true, value:true },
      mode:"standard", template:"", extra:"", files:[],
      requirement:"", extraInfo:"", proposal:null, epic:null, features:null, stories:null,
      assignee:"", label:(kind === "polish" ? "ai-polished" : "ai-draft"),
      sel:(kind === "split" || kind === "stories") ? new Set() : null,
      expanded:{}

  };
  if (W.data.sel === null) delete W.data.sel;

}
function closeWizard(){ W = null; closeModal(); }

function renderWizard(){
  const titles = { polish:"Polish with AI", createEpic:"Create Epic", split:"Split into Features", stories:"Break down into Stories" };
  const t = W.issue ? titles[W.kind] + ' <span class="k">' + W.issue.key + '</span>' : titles[W.kind];
  const footer =
    '<button class="btn" onclick="closeWizard()">Cancel</button>' +
    (W.step > 0 ? '<button class="btn" onclick="wizBack()">Back</button>' : '') +
    (W.step < 3
      ? '<button class="btn primary" id="wiz-next" onclick="wizNext()">Next</button>'
      : '<button class="btn primary" id="wiz-next" onclick="wizFinal()">' +
        (W.kind === "polish" ? "Approve &amp; Sync" : "Create in Jira") + '</button>');

  $("#modal-root").innerHTML =
    '<div class="sheet"><div class="sheet-head"><h2>' + t + '</h2>' +
      '<span class="k">· ' + (W.kind === "polish" ? "improve existing fields" : "generate new Jira issues") + '</span>' +
      '<div class="right"><button class="icon-btn" onclick="closeWizard()">✕</button></div></div>' +
    '<div class="wiz"><ol class="stepper">' +
      STEPS.map((s, idx) => '<li class="' + (idx < W.step ? "done" : idx === W.step ? "on" : "") + '">' +
        '<span class="dot">' + (idx < W.step ? "✓" : idx + 1) + '</span>' + s + '</li>').join("") +
    '</ol>' +
    '<div class="wiz-body">' + wizardContent() + '</div></div>' +
    '<div class="wiz-foot">' + footer + '</div></div>';
  $("#modal-root").classList.add("show");
  if (W.step === 2 && !draftDone()) runDraft();
  const ta = $("#wiz-req");
  if (ta) ta.addEventListener("input", () => { W.data.requirement = ta.value; $("#req-count").textContent = ta.value.length + " chars (min 5)"; });
  const ex = $("#wiz-extra");
  if (ex) ex.addEventListener("input", () => { W.data.extra = ex.value; $("#extra-count").textContent = ex.value.length + "/2000"; });
}
function draftDone(){
  const d = W.data;
  return !!(d.proposal || d.epic || d.features || d.stories);
}
function wizBack(){ if (W.step > 0){ W.step--; renderWizard(); } }
function wizNext(){
  if (W.step === 0 && W.kind === "createEpic" && (W.data.requirement || "").trim().length < 5){
    if (!$("#req-err")) $("#wiz-next").insertAdjacentHTML("afterend", '<span class="err" id="req-err" style="margin-right:10px">Requirement must be at least 5 characters</span>');
    return;
  }
  W.step++;
  renderWizard();
}

  const btn = $("#wiz-next");

                  (W.kind === "polish" ? "Syncing to Jira…" : "Creating in Jira…");
  await sleep(950);
  if (W.kind === "polish") applyPolish();
  else if (W.kind === "createEpic") applyCreateEpic();

   ========================================================================== */
function openBatch(){
  const keys = Array.from(state.sel).slice(0, 10);
  if (!keys.length) return;
  openSheet({
    title:"Batch Polish", sub:keys.length + " issue" + (keys.length > 1 ? "s" : "") + " · max 10 per run",
    body:
      '<p class="hint">Each issue is refined with Standard Instructions, re-scored, then synced. ' +
      'Failures never block the rest of the queue. <i>(Real impl: server-side queue + rate limiting.)</i></p>' +
      '<div class="bar"><i id="bp-bar" style="width:0%"></i></div>' +
      '<div class="muted" id="bp-summary" style="font-size:12.5px">Waiting to start…</div>' +
      '<div style="margin-top:12px">' +
        keys.map(k => {
          const i = findIssue(k);
          return '<div class="batch-row" id="bp-' + k + '"><b>' + k + '</b>' +
            '<span class="muted" style="font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%">' +
            esc(i.summary) + '</span>' +
            '<span class="muted" style="font-size:12.5px">' + i.score + '/5</span>' +
            '<span class="stt q">Queued</span></div>';
        }).join("") +
      '</div>',
    foot:'<button class="btn" onclick="closeModal()">Close</button>' +
         '<button class="btn primary" id="bp-run" onclick="runBatch()">Run Batch Polish</button>'
  });
  window.__batchKeys = keys;
}
async function runBatch(){
  const keys = window.__batchKeys || [];
  const btn = $("#bp-run");
  btn.disabled = true; btn.textContent = "Running…";
  let done = 0, failed = 0;
  for (let n = 0; n < keys.length; n++){
    const k = keys[n], row = document.getElementById("bp-" + k);
    row.querySelector(".stt").className = "stt r";
    row.querySelector(".stt").textContent = "Polishing…";
    await sleep(600);
    /* deterministic mock failure: every 4th issue fails schema validation */
    const fail = (n + 1) % 4 === 0;
    if (fail){
      failed++; done++;
      row.querySelector(".stt").className = "stt f";
      row.querySelector(".stt").textContent = "Failed — schema validation";
    } else {
      const i = findIssue(k);
      i.before = i.score; i.score = 5; i.marker = "ai-polished";
      done++;
      row.querySelector(".stt").className = "stt d";
      row.querySelector(".stt").textContent = "Synced ✓ " + i.before + " → 5";
    }
    $("#bp-bar").style.width = Math.round(done / keys.length * 100) + "%";
    $("#bp-summary").textContent = done + " of " + keys.length + " processed" +
      (failed ? " · " + failed + " failed" : "");
  }
  btn.textContent = failed ? "Retry failed (" + failed + ")" : "Done ✓";
  if (!failed) btn.onclick = () => { closeModal(); render(); };
  else btn.onclick = () => { toast("Retrying failed items", "(mock) retry succeeded on second attempt", "ok");
    keys.filter((_, n) => (n + 1) % 4 === 0).forEach(k => { const i = findIssue(k); i.before = i.score; i.score = 5; i.marker = "ai-polished"; });
    closeModal(); render(); };
  toast("Batch finished", done - failed + " polished · " + failed + " failed", failed ? "err" : "ok");
}

      [0,1,2,3,4].map(r => '<rect x="20" y="' + (62 + r * 17) + '" width="180" height="8" rx="4" fill="#EDEFF8"/>' +
        '<rect x="240" y="' + (60 + r * 17) + '" width="40" height="12" rx="6" fill="' + (r === 1 ? "#E9F8EF" : "#F6F7FC") +
        '" stroke="#D7DAEC"/>').join(""),
    "scr-dashboard":
      [0,1,2,3].map(c => '<rect x="' + (12 + c * 70) + '" y="28" width="62" height="36" rx="6" fill="#fff" stroke="#D7DAEC"/>' +
        '<rect x="' + (20 + c * 70) + '" y="36" width="30" height="10" rx="4" fill="#EEEDFD"/>' +
        '<rect x="' + (20 + c * 70) + '" y="50" width="20" height="7" rx="3" fill="#D7DAEC"/>').join("") +
      '<rect x="12" y="72" width="176" height="78" rx="6" fill="#fff" stroke="#D7DAEC"/>' +
      [0,1,2,3,4].map(c => '<rect x="' + (24 + c * 32) + '" y="' + (140 - (c % 3 + 1) * 18) + '" width="18" height="' + ((c % 3 + 1) * 18) + '" rx="3" fill="#6459E8" opacity="' + (0.5 + c * 0.1) + '"/>').join("") +
      '<rect x="196" y="72" width="92" height="78" rx="6" fill="#fff" stroke="#D7DAEC"/>' +
      [0,1,2].map(r => '<rect x="204" y="' + (84 + r * 20) + '" width="76" height="9" rx="4" fill="#EDEFF8"/>').join("")
  };
  return '<svg viewBox="0 0 300 165" width="' + w + '" height="' + h + '" preserveAspectRatio="xMidYMid slice">' +
         bg + bar + (parts[id] || "") + '</svg>';
}
function renderFigma(){
  const stepsBar = '<div class="fstep">' + F_STEPS.map((s, ix) =>
    '<div class="s ' + (F.step === ix + 1 ? "on" : F.step > ix + 1 ? "done" : "") + '">' +
    '<span class="n">' + (F.step > ix + 1 ? "✓" : ix + 1) + '</span>' + s + '</div>').join("") + '</div>';

  let body = "";
  if (F.step === 1){
    body = '<div class="card"><div class="pad">' +
      '<h3 style="margin:0 0 4px">Connect Figma</h3>' +
      '<p class="hint">Paste a file link and token — or use the demo file already shared with the tool.</p>' +
      '<label class="f">Figma file URL</label><input type="text" id="fg-url" value="https://figma.com/file/SF-PAYOPS-Demo/Payments-Ops?node-id=0-1">' +
      '<label class="f">Personal access token</label><input type="password" value="••••••••••••••••">' +
      '<div class="inline-note">Real impl: <span class="mono">GET /v1/files/:key</span> to validate, then ' +
      '<span class="mono">/v1/images/:key</span> to render frames.</div>' +
      '<div style="margin-top:14px"><button class="btn primary" onclick="figmaConnect(this)">Connect</button></div>' +
    '</div></div>';
  } else if (F.step === 2){
    body = '<div class="page-head"><div><h1 style="font-size:16px">Select screens to import</h1>' +
      '<p>Pick the frames that should become Jira Stories. Multi-select.</p></div>' +
      '<div class="actions"><span class="chip" style="background:var(--accent-soft);color:#4A40C7">' + F.sel.size + ' selected</span>' +
      '<button class="btn primary" ' + (F.sel.size === 0 ? "disabled" : "") + ' onclick="figmaAnalyze()">✨ Analyze ' + F.sel.size + ' screens</button></div></div>' +
      '<div class="screens">' + SCREENS.map(s =>
        '<div class="screen ' + (F.sel.has(s.id) ? "on" : "") + '" onclick="figmaToggle(\'' + s.id + '\')">' +
          '<span class="tick">✓</span><div class="thumb">' + screenSvg(s.id, 250) + '</div>' +
          '<div class="cap">' + s.name + '</div></div>').join("") + '</div>';
  } else if (F.step === 3){
    body = F.specs
      ? '<div class="page-head"><div><h1 style="font-size:16px">Screen analysis (' + F.specs.length + ')</h1>' +
        '<p>Extracted by the Screen Analyst (vision model) — review before composing stories.</p></div>' +
        '<div class="actions"><button class="btn primary" onclick="figmaCompose()">Compose ' + F.specs.length + ' Stories ➜</button></div></div>' +
        F.specs.map(sp => '<div class="spec"><h4>' + esc(sp.title) + '</h4>' +
          '<div class="muted" style="font-size:12.5px">' + sp.id + '</div>' +
          '<div class="kv"><b>Elements:</b> ' + sp.elements.join(" · ") + '</div>' +
          '<div class="kv"><b>Validations:</b> ' + sp.validations.join(" · ") + '</div>' +
          '<div class="kv"><b>States:</b> ' + sp.states.join(" · ") + '</div></div>').join("")
      : '<div class="center-state" id="fg-analyze"><div class="spin"></div><b>Analyzing ' + F.sel.size +
        ' screens…</b>Simulated vision call — collecting frame renders + node text.</div>';
  } else if (F.step === 4){
    body = '<div class="page-head"><div><h1 style="font-size:16px">Compose stories (' + F.stories.length + ')</h1>' +
      '<p>Edit anything before publishing. Each story keeps its Figma deep link.</p></div>' +
      '<div class="actions"><button class="btn primary" onclick="figmaPublish(this)">Publish ' + F.stories.length +
      ' Stories ➜</button></div></div>' +
      F.stories.map((s, ix) => '<div class="story-card"><div class="sh">' +
        '<div class="thumbsm">' + screenSvg(s.screenId, 74) + '</div>' +
        '<span class="tg" style="border:1px solid #BFE8D0;background:#fff;color:#0C7A3E;border-radius:20px;font-size:11.5px;font-weight:700;padding:1px 9px">Story ' + (ix + 1) + '</span>' +
        '<b style="flex:1">' + esc(s.title) + '</b>' +
        '<select style="width:70px"><option>' + s.points + ' pts</option><option>1</option><option>2</option><option>3</option><option>5</option></select>' +
        '<button class="icon-btn" onclick="toast(\'Inline editor\',\'(mock)\')">✎</button></div>' +
        '<div class="sb"><div style="font-weight:650">' + esc(s.story) + '</div>' +
        '<div class="muted" style="font-size:12px;margin-top:6px">⬚ Source: ' +
          '<span class="mono">figma.com/file/SF-PAYOPS-Demo?node-id=' + s.screenId + '</span></div>' +
        '<pre>' + esc(s.ac) + '</pre></div></div>').join("");
  } else {
    body = '<div class="center-state"><div style="font-size:34px">✅</div>' +
      '<b>' + F.stories.length + ' Stories created in PAYOPS</b>' +
      'Keys: ' + (F.publishedKeys || []).join(", ") +
      '<div class="inline-note">Each issue has the screen thumbnail attached, the Figma deep link in its ' +
      'description and the <span class="mk">ai-draft</span> label.</div>' +
      '<div style="margin-top:16px"><button class="btn primary" onclick="figmaReset()">Start another import</button> ' +
      '<button class="btn" onclick="go(\'stories\')">View in Stories ➜</button></div></div>';
  }

  const nav = F.step < 5 && F.step > 1
    ? '<div style="display:flex;gap:9px;justify-content:flex-end;margin-top:16px">' +
      (F.step > 2 ? '<button class="btn" onclick="F.step--;renderMain()">Back</button>' : '') + '</div>'
    : "";

  $("#main").innerHTML =
    '<div class="page-head"><div><h1>Design Import</h1><p>Figma screens ➜ sprint-ready Jira Stories ' +
    '(Gherkin AC + screenshots). <b>Stories only</b> in v1.</p></div></div>' +
    stepsBar + body + nav;
}
function figmaToggle(id){
  F.sel.has(id) ? F.sel.delete(id) : F.sel.add(id);
  renderFigma();
}
async function figmaConnect(btn){
  btn.disabled = true; btn.innerHTML = '<span class="spin sm"></span> Connecting…';
  await sleep(900);
  F.connected = true; F.step = 2;
  renderFigma();
  toast("Figma connected", "6 frames found in SF-PAYOPS-Demo", "ok");
}
async function figmaAnalyze(){
  F.step = 3; renderFigma();
  const picked = SCREENS.filter(s => F.sel.has(s.id));
  F.specs = await MOCK_AI.analyzeScreens(picked);
  renderFigma();
  toast("Analysis complete", picked.length + " ScreenSpecs ready for review", "ok");
}
function figmaCompose(){
  F.stories = MOCK_AI.composeStories(F.specs);
  F.step = 4; renderFigma();
}
async function figmaPublish(btn){
  btn.disabled = true; btn.innerHTML = '<span class="spin sm"></span> Creating in Jira…';
  await sleep(1100);
  const base = DB.stories.reduce((a, i) => Math.max(a, parseInt(i.key.split("-")[1], 10) || 0), 320);
  F.publishedKeys = F.stories.map((_, ix) => "PAYOPS-" + (base + 1 + ix));
  F.stories.forEach((s, ix) => DB.stories.unshift({
    key:"PAYOPS-" + (base + 1 + ix), type:"Story", status:"Backlog", assignee:"Unassigned",
    updated:"2026-11-06 09:30", score:5, before:null, marker:"ai-draft",
    summary:s.story, fields:{ summary:s.story, description:"Screen: " + s.screenId, successCriteria:s.ac, value:"" }
  }));
  F.step = 5; renderFigma(); renderRail();
  toast(F.stories.length + " Stories created in Jira", "thumbnails attached · Figma links embedded", "ok");
}
function figmaReset(){
  F.step = 1; F.connected = false; F.sel.clear(); F.specs = null; F.stories = null;
  renderFigma();
}

/* ==========================================================================
   BOOTSTRAP
   ========================================================================== */
render();
toast("Prototype ready", "Try: Epics → ⋮ → Polish with AI, or Design Import", "");
</script>
</body>
</html>
